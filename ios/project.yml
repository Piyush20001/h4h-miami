name: StormCard
options:
  bundleIdPrefix: com.h4hmiami
  deploymentTarget:
    iOS: "17.0"
targets:
  StormCard:
    type: application
    platform: iOS
    sources: [StormCard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.h4hmiami.stormcard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StormCard
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: StormCard connects to the StormCard laptop on this Wi-Fi.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: StormCard uses your location to find your storm surge zone and nearby shelters.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    info:
      path: StormCard/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        StormCardServer: "http://10.88.2.23:8000"
        ITSAppUsesNonExemptEncryption: false
