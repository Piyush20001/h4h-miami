<!doctype html>
<html lang="ht"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StormCard - Canon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e5e7eb;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111827}
.phone{width:390px;height:844px;overflow:hidden;background:#f3f4f6;display:flex;flex-direction:column;position:relative}
header{background:#fff;height:72px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d1d5db;flex:none}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em;color:#1d4ed8}
.seg{display:flex;border:2px solid #1d4ed8;border-radius:10px;overflow:hidden}
.seg span{min-width:48px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#1d4ed8;background:#fff}
.seg .on{background:#1d4ed8;color:#fff}
main{padding:14px 16px 0;display:flex;flex-direction:column;gap:12px;flex:1}
.card{background:#fff;border:1px solid #d1d5db;border-radius:14px}
.zone{padding:14px 16px;display:flex;align-items:center;gap:14px}
.pill{background:#dc2626;color:#fff;font-weight:800;font-size:22px;padding:8px 18px;border-radius:999px;white-space:nowrap}
.zone p{font-size:18px;line-height:1.3;font-weight:600}
.label{display:flex;align-items:center;gap:10px;margin-top:2px}
.label b{font-size:18px;font-weight:800}
.tag{font-size:18px;font-weight:600;color:#374151;border:1.5px dashed #6b7280;border-radius:6px;padding:0 8px;line-height:24px}
.list{overflow:hidden}
.row{min-height:72px;padding:10px 16px;display:flex;align-items:center;gap:10px;border-top:1px solid #e5e7eb}
.row:first-child{border-top:0}
.row div{flex:1}
.row strong{display:block;font-size:18px;line-height:1.2;font-weight:700}
.row small{font-size:18px;color:#374151;font-weight:500}
.chev{font-size:28px;color:#1d4ed8;font-weight:700}
.info{padding:12px 16px;display:flex;gap:12px;align-items:center;background:#eff6ff;border-color:#1d4ed8;font-size:18px;font-weight:600;line-height:1.3;min-height:64px}
.i{flex:none;width:32px;height:32px;border-radius:50%;background:#1d4ed8;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
footer{background:#fff;padding:12px 16px 24px;border-top:1px solid #d1d5db;flex:none}
.btn{display:flex;align-items:center;justify-content:center;height:64px;border-radius:14px;background:#1d4ed8;color:#fff;font-size:22px;font-weight:800}
</style></head><body>
<div class="phone">
<header><h1>StormCard</h1><div class="seg"><span class="on">KRE</span><span>ES</span><span>EN</span></div></header>
<main>
<div class="card zone"><span class="pill">Zòn B</span><p>Se pa zòn asirans inondasyon an.</p></div>
<div class="label"><b>Abri pi pre</b><span class="tag">egzanp</span></div>
<div class="card list">
<div class="row"><div><strong>Miami Edison Senior High</strong><small>0.8 mi · 🐾</small></div><span class="chev">›</span></div>
<div class="row"><div><strong>Toussaint L'Ouverture Elementary</strong><small>1.1 mi</small></div><span class="chev">›</span></div>
<div class="row"><div><strong>North Miami Beach Senior High</strong><small>4.6 mi · 🐾</small></div><span class="chev">›</span></div>
</div>
<div class="card info"><span class="i">!</span>Rele 311 pou konfime abri a louvri.</div>
</main>
<footer><div class="btn">Kote pou m ale</div></footer>
</div>
</body></html>
