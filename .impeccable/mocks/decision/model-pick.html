<!doctype html>
<html lang="ht"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StormCard - Zòn B</title>
<style>
:root{--blue:#0a3d91;--white:#fff;--yellow:#ffd400;--black:#111}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#d9dde3;display:flex;justify-content:center;font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;color:var(--black)}
.phone{width:390px;height:844px;overflow:hidden;background:var(--blue);display:flex;flex-direction:column;position:relative}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:4px solid var(--white)}
.hdr svg{width:44px;height:44px;flex:none}
.brand{font-size:26px;font-weight:900;letter-spacing:.06em;color:var(--white);text-transform:uppercase;flex:1}
.lang{display:flex;border:3px solid var(--white);border-radius:8px;overflow:hidden}
.lang span{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:var(--white);letter-spacing:.04em}
.lang .on{background:var(--yellow);color:var(--black)}
.body{flex:1;padding:14px 16px 0;display:flex;flex-direction:column;gap:12px}
.zone{background:var(--white);border:4px solid var(--black);outline:3px solid var(--white);border-radius:12px;display:flex;gap:12px;padding:10px 12px;align-items:center;box-shadow:0 0 0 3px var(--blue) inset}
.zone b{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--blue);color:var(--white);width:84px;height:84px;border-radius:10px;font-size:15px;letter-spacing:.1em;font-weight:900;flex:none}
.zone b i{font-style:normal;font-size:44px;line-height:.95;letter-spacing:0}
.zone p{font-size:19px;line-height:1.25;font-weight:700}
.lbl{display:flex;justify-content:space-between;align-items:center;color:var(--white);font-size:20px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.tag{background:var(--yellow);color:var(--black);font-size:14px;padding:2px 8px;border-radius:4px;letter-spacing:.06em}
.plate{display:flex;align-items:center;gap:12px;min-height:72px;background:var(--white);border:3px solid var(--black);outline:2px solid var(--white);border-radius:10px;padding:8px 12px 8px 8px;text-decoration:none;color:var(--black)}
.arrow{width:52px;height:52px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.arrow svg{width:34px;height:34px}
.plate div{flex:1;min-width:0}
.plate strong{display:block;font-size:19px;line-height:1.1;font-weight:900;letter-spacing:.01em}
.plate small{display:block;font-size:18px;font-weight:700;margin-top:3px}
.plate small em{font-style:normal;background:var(--blue);color:var(--white);padding:0 7px;border-radius:4px;margin-right:6px}
.call{display:flex;align-items:center;gap:10px;background:var(--yellow);border:3px solid var(--black);border-radius:10px;padding:10px 12px;font-size:19px;font-weight:900;line-height:1.2}
.call svg{width:30px;height:30px;flex:none}
.cta{margin:auto 0 18px;height:68px;width:100%;background:var(--yellow);color:var(--black);border:4px solid var(--black);border-radius:12px;font:900 26px "Arial Narrow",Arial,sans-serif;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 0 var(--black)}
</style></head><body>
<main class="phone">
  <header class="hdr">
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#fff"/><path d="M24 24c0-3 3-4 5-2s1 6-3 7c-6 1-10-4-8-9 2-6 11-8 16-3 5 6 2 15-6 17" fill="none" stroke="#0a3d91" stroke-width="3.5" stroke-linecap="round"/><circle cx="24" cy="24" r="2.5" fill="#0a3d91"/></svg>
    <div class="brand">StormCard</div>
    <nav class="lang" aria-label="Lang"><span class="on">KRE</span><span>ES</span><span>EN</span></nav>
  </header>
  <section class="body">
    <div class="zone"><b>ZÒN<i>B</i></b><p>Se zòn inondasyon tanpèt ou. Se pa zòn asirans inondasyon an.</p></div>
    <div class="lbl"><span>Abri ki pre ou</span><span class="tag">egzanp</span></div>
    <a class="plate" href="#"><span class="arrow"><svg viewBox="0 0 34 34"><path d="M17 3l14 14H22v14H12V17H3z" fill="#fff" transform="rotate(90 17 17)"/></svg></span><div><strong>Miami Edison Senior High</strong><small><em>0.8 mi</em>🐾</small></div></a>
    <a class="plate" href="#"><span class="arrow"><svg viewBox="0 0 34 34"><path d="M17 3l14 14H22v14H12V17H3z" fill="#fff" transform="rotate(90 17 17)"/></svg></span><div><strong>Toussaint L'Ouverture Elementary</strong><small><em>1.1 mi</em></small></div></a>
    <a class="plate" href="#"><span class="arrow"><svg viewBox="0 0 34 34"><path d="M17 3l14 14H22v14H12V17H3z" fill="#fff" transform="rotate(90 17 17)"/></svg></span><div><strong>North Miami Beach Senior High</strong><small><em>4.6 mi</em>🐾</small></div></a>
    <div class="call"><svg viewBox="0 0 30 30"><path d="M7 3h5l2 7-3 2c1 3 4 6 7 7l2-3 7 2v5c0 2-2 3-4 3C13 26 4 17 4 7c0-2 1-4 3-4z" fill="#111"/></svg>Rele 311 pou konfime abri a louvri.</div>
    <button class="cta">Kisa pou m pote <span>→</span></button>
  </section>
</main>
</body></html>
