<!doctype html>
<html lang="ht"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StormCard - Laminated Emergency Card</title>
<style>
:root{--ink:#111;--red:#c8102e;--blue:#0b5cad;--warm:#fff4d6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#d9dde3;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
.phone{width:390px;height:844px;overflow:hidden;background:#e9edf2;padding:10px;display:flex;flex-direction:column}
.card{flex:1;min-height:0;background:#fff;border-radius:24px;border:3px solid var(--ink);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 5px #cfd6df}
.card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.55) 40%,rgba(255,255,255,0) 50%)}
header{background:var(--red);color:#fff;height:60px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;flex:none}
.logo{font-size:24px;font-weight:900;display:flex;align-items:center;gap:8px}
.lang{display:flex;gap:2px;font-size:15px;font-weight:700}
.lang span{padding:8px 6px;border-radius:8px}
.lang .on{background:#fff;color:var(--red)}
main{padding:10px 14px 0;flex:1;min-height:0;display:flex;flex-direction:column}
.label{font-size:20px;font-weight:800;letter-spacing:.04em;color:var(--blue)}
.zone{font-size:88px;line-height:.95;font-weight:900;letter-spacing:-.02em}
.note{font-size:20px;font-weight:700;margin:4px 0 8px;padding:6px 10px;background:var(--warm);border-left:6px solid var(--red);border-radius:6px}
.rows{list-style:none;display:flex;flex-direction:column;gap:6px}
.rows li{min-height:60px;border:2px solid var(--ink);border-radius:14px;padding:4px 10px;display:flex;align-items:center;gap:10px}
.rows svg{flex:none}
.nm{font-size:20px;font-weight:800;line-height:1.1;flex:1}
.mi{font-size:20px;font-weight:900;color:var(--blue);white-space:nowrap}
.pet{font-size:22px}
.tag{align-self:flex-end;font-size:12px;font-weight:700;color:#444;background:var(--warm);border-radius:6px;padding:1px 7px;margin:2px 2px 4px}
.call{display:flex;gap:10px;align-items:center;font-size:20px;font-weight:700;line-height:1.15;background:var(--warm);border-radius:14px;padding:6px 10px;min-height:60px}
footer{padding:8px 14px 14px;flex:none}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:68px;border-radius:18px;background:var(--blue);color:#fff;border:0;font:900 26px inherit;font-family:inherit;box-shadow:0 4px 0 #083d73}
</style></head><body>
<div class="phone"><div class="card">
<header>
<div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M12 3a9 9 0 0 0-9 9h18a9 9 0 0 0-9-9z"/><path d="M12 12v7a2 2 0 0 0 4 0"/></svg>StormCard</div>
<div class="lang"><span class="on">KRE</span><span>·</span><span>ES</span><span>·</span><span>EN</span></div>
</header>
<main>
<div class="label">ZÒN TANPÈT OU</div>
<div class="zone">ZÒN C</div>
<p class="note">Se pa zòn asirans inondasyon an.</p>
<ul class="rows">
<li><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#c8102e" stroke-width="2.4" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"/><path d="M10 20v-6h4v6"/></svg><span class="nm">Miami Edison Senior High</span><span class="mi">0.8 mi</span><span class="pet">🐾</span></li>
<li><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#c8102e" stroke-width="2.4" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"/><path d="M10 20v-6h4v6"/></svg><span class="nm">Toussaint L'Ouverture Elementary</span><span class="mi">1.1 mi</span></li>
<li><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#c8102e" stroke-width="2.4" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"/><path d="M10 20v-6h4v6"/></svg><span class="nm">North Miami Beach Senior High</span><span class="mi">4.6 mi</span><span class="pet">🐾</span></li>
</ul>
<span class="tag">egzanp done</span>
<div class="call"><svg width="34" height="34" viewBox="0 0 24 24" fill="#0b5cad"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11 11 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.250.2 2.450.6 3.600a1 1 0 0 1-.25 1z"/></svg><span>Rele 311 pou konfime yon abri louvri anvan ou ale.</span></div>
</main>
<footer><button class="btn">Kote pou m ale →</button></footer>
</div></div>
</body></html>
